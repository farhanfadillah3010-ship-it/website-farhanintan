<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Pink Memories</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            color: #5d4037; min-height: 100vh; overflow-x: hidden;
        }

        /* Overlay Awal (Hanya muncul sekali) */
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 175, 189, 0.98);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999; text-align: center;
        }

        .btn-start {
            background: #d81b60; color: white; border: none;
            padding: 15px 35px; border-radius: 50px; font-weight: bold;
            font-size: 18px; cursor: pointer; box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
        }

        /* Navigasi */
        nav {
            display: flex; justify-content: center; padding: 20px 0; gap: 25px;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
        }

        nav a {
            color: rgba(93, 64, 55, 0.8); text-decoration: none;
            font-size: 16px; font-weight: 500; cursor: pointer;
        }

        nav a.active { color: #d81b60; font-weight: bold; border-bottom: 2px solid #d81b60; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; text-align: center; }

        .page { display: none; animation: fadeIn 0.5s ease; }
        .active-page { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .counter-container {
            background: white; padding: 25px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 30px 0;
            border: 2px dashed #ffafbd;
        }
        .counter-time { font-size: 22px; font-weight: bold; color: #d81b60; margin-top: 10px; }

        .click-heart { position: absolute; color: #d81b60; font-size: 20px; pointer-events: none; animation: heartFloat 1s ease-out forwards; }
        @keyframes heartFloat { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-50px); opacity: 0; } }
    </style>
</head>
<body onclick="spawnHeart(event)">

    <!-- TOMBOL MULAI (Agar navigasi tidak hilang, ini adalah lapisan atas) -->
    <div id="welcome-overlay">
        <h2 style="color: white; margin-bottom: 20px;">Welcome Home 🌸</h2>
        <button class="btn-start" onclick="mulaiSemua()">Buka Kenangan ✨</button>
        <p style="color: white; font-size: 12px; margin-top: 15px;">(Klik untuk memutar musik otomatis)</p>
    </div>

    <!-- PLAYER YOUTUBE TERSEMBUNYI -->
    <div id="player-container"></div>

    <nav id="main-nav" style="visibility: hidden;">
        <a onclick="showPage('home')" id="nav-home" class="active">Home</a>
        <a onclick="showPage('memories')" id="nav-memories">Memories</a>
        <a onclick="showPage('message')" id="nav-message">Message</a>
    </nav>

    <div class="container" id="main-container" style="visibility: hidden;">
        <!-- HOME PAGE -->
        <div id="home" class="page active-page">
            <h2 style="color: #ad1457;">Welcome Home 🌸</h2>
            <div class="counter-container">
                <p style="margin: 0; font-size: 14px; color: #888;">Waktu Bersama:</p>
                <div id="days-counter" class="counter-time">Loading...</div>
            </div>
            <p style="color: #d81b60; font-weight: bold;">Lagu: Aku Milikmu - Dewa 19</p>
        </div>

        <!-- MEMORIES PAGE -->
        <div id="memories" class="page">
            <h2 style="color: #ad1457;">🌸 Our Memories 🌸</h2>
            <div class="counter-container">
                <p>Tempat menyimpan foto atau cerita kenangan kita...</p>
            </div>
        </div>

        <!-- MESSAGE PAGE -->
        <div id="message" class="page">
            <h2 style="color: #ad1457;">💌 Message Board 💌</h2>
            <div class="counter-container">
                <p>Pesan manis untukmu...</p>
            </div>
        </div>
    </div>

    <script>
        // YouTube API Setup
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player-container', {
                height: '0', width: '0',
                videoId: 'gT9g1cW1H-4',
                playerVars: { 'autoplay': 0, 'loop': 1, 'playlist': 'gT9g1cW1H-4' }
            });
        }

        function mulaiSemua() {
            // Hilangkan Overlay
            document.getElementById('welcome-overlay').style.display = 'none';
            
            // Munculkan Navigasi dan Konten
            document.getElementById('main-nav').style.visibility = 'visible';
            document.getElementById('main-container').style.visibility = 'visible';
            
            // Putar Musik
            if (player) { player.playVideo(); }
            
            updateCounter();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            document.getElementById(pageId).classList.add('active-page');
            document.getElementById('nav-' + pageId).classList.add('active');
        }

        function spawnHeart(e) {
            const heart = document.createElement('div');
            heart.className = 'click-heart';
            heart.innerHTML = '❤️';
            heart.style.left = e.pageX + 'px';
            heart.style.top = e.pageY + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        function updateCounter() {
            const startDate = new Date("2024-01-01"); 
            setInterval(() => {
                const diff = new Date() - startDate;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("days-counter").innerHTML = `${d} Hari Bersama`;
            }, 1000);
        }
    </script>
</body>
</html>
